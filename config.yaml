# Payer Star Ratings - Deployment Configuration
# ✅ THIS IS THE ONLY FILE YOU NEED TO EDIT
# Change values here - notebooks and app automatically read from this file
#
# 📝 HOW TO FIND URLs:
#    notebooks_folder_url: After deployment, go to Workspace → browse to .bundle/payer_star_ratings/{env}/files/setup/ → copy URL
#    setup_job_url: After deployment, go to Workflows → Jobs → find payer_stars_setup_{env} → copy URL
#    See docs/SETUP_RESOURCES_CONFIG.md for detailed instructions

# Default environment (used when no STARS_ENV variable set)
default_environment: dev

environments:
  # All environments in same workspace, separated by catalog names
  dev:
    workspace_host: "https://adb-984752964297111.11.azuredatabricks.net"
    profile: "DEFAULT_azure"
    catalog: "payer_stars_dev"
    schema: "star_ratings" # Correct - matches actual deployed schema
    warehouse_id: "148ccb90800933a1"
    vector_endpoint: "one-env-shared-endpoint-2"
    llm_endpoint: "databricks-claude-sonnet-4-5"
    app_name: "payerstars-dev" # Matches databricks.yml (hyphens, not underscores!)
    genie_space_id: "" # Get from config_genie table or Genie UI after setup

    # Setup Resources URLs (for 5_setup_resources.py page)
    notebooks_folder_url: "https://adb-984752964297111.11.azuredatabricks.net/browse/folders/908565040797499?o=984752964297111"
    setup_job_url: "https://adb-984752964297111.11.azuredatabricks.net/jobs/675854142625590?o=984752964297111"

  staging:
    workspace_host: "https://fevm-serverless-mwelio-humana.cloud.databricks.com" # Same workspace as prod
    profile: "FEVM_aws" # Same profile as prod
    catalog: "humana_payer" # Pre-created catalog
    schema: "star_ratings"
    warehouse_id: "6b2808a405a0375a"
    vector_endpoint: "one-env-shared-endpoint-2"
    llm_endpoint: "databricks-claude-sonnet-4-5"
    app_name: "payerstars-staging" # Hyphens, not underscores!
    genie_space_id: "" # REQUIRED: Get this from setup/14_create_genie_space.py output

    # Setup Resources URLs (for Setup Resources page)
    notebooks_folder_url: "https://fevm-serverless-mwelio-humana.cloud.databricks.com/browse/folders/2206858257421473?o=7474651608287314"
    setup_job_url: "https://fevm-serverless-mwelio-humana.cloud.databricks.com/jobs/45759612976336?o=7474651608287314"

  prod:
    workspace_host: "https://fevm-serverless-mwelio-humana.cloud.databricks.com"
    profile: "FEVM_aws"
    catalog: "humana_payer" # Pre-created catalog
    schema: "star_ratings"
    warehouse_id: "6b2808a405a0375a"
    vector_endpoint: "one-env-shared-endpoint-2"
    llm_endpoint: "databricks-claude-sonnet-4-5"
    app_name: "payerstars-prod" # Hyphens, not underscores!
    genie_space_id: "" # REQUIRED: Get this from setup/14_create_genie_space.py output

    # Setup Resources URLs (for Setup Resources page)
    notebooks_folder_url: "https://fevm-serverless-mwelio-humana.cloud.databricks.com/browse/folders/2206858257421473?o=7474651608287314"
    setup_job_url: "https://fevm-serverless-mwelio-humana.cloud.databricks.com/jobs/45759612976336?o=7474651608287314"

# Common configuration (shared across all environments)
common:
  spark_version: "16.4.x-scala2.12"
  node_type: "Standard_DS3_v2"
  num_workers: 2

  # Data generation settings
  num_measures: 45 # Number of HEDIS measures to generate
  gap_rate: 0.50 # 50% of measures have performance gaps

  # Genie Space settings (used by API creation)
  genie_space_display_name: "Star Ratings Analytics"
  genie_space_description: "Query payer star ratings data and trends with natural language"

  # Vector search settings
  embedding_model: "databricks-gte-large-en"
  sync_type: "TRIGGERED"
